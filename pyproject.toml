[project]
name = "media-mcp"
version = "0.1.0"
description = "Media request MCP server - search/request/track movies & TV via Seerr + Radarr/Sonarr. No deletes by construction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.1",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
